<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolsBox</title>
  <meta name="description" content="ToolsBox：时间戳转换、MD5 计算等常用开发者小工具，可直接部署到 GitHub Pages。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Cg transform='translate(12 12) scale(1.65)' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/%3E%3C/g%3E%3C/svg%3E">
  <!-- 主题初始化：必须在样式表渲染前执行，避免闪烁 -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('toolbox-theme'); } catch (e) {}
      if (saved !== 'light' && saved !== 'dark') {
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261030">
</head>
<body>
  <!-- 移动端顶栏（桌面端隐藏） -->
  <header class="topbar">
    <button class="topbar-btn" id="menu-toggle" type="button" aria-label="打开导航菜单">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="topbar-title" id="topbar-title">ToolsBox</span>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-logo" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <span class="brand-name">ToolsBox</span>
        <span class="brand-tag">v0.1</span>
      </a>

      <nav class="nav" id="nav">
        <a class="nav-item" data-id="home" href="#/">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </span>
          <span>首页</span>
        </a>
        <div class="nav-divider"></div>
        <!-- 工具分组由 app.js 根据 ToolBox.register(...) 的注册信息自动渲染 -->
        <div id="nav-groups"></div>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题"></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
      <div class="view" id="view"></div>
    </main>
  </div>

  <script src="js/app.js?v=20261030" defer></script>
  <script src="js/md5.js?v=20261030" defer></script>
  <!-- ============================================================
       ▼ 新增一个工具只需要 2 步：
         1. 在 js/tools/ 下新建 your-tool.js，调用 ToolBox.register({...})
            （模板见 js/tools/timestamp.js 的文件头注释）
         2. 在下面按现有顺序加一行：
              <script src="js/tools/your-tool.js?v=20261030" defer></script>
       侧边栏导航、首页卡片、hash 路由（#/your-tool）全部自动生成。

       注意：资源 URL 上的 ?v= 用于强制刷新浏览器缓存（静态站无构建工具，
       发布改动时需把 v 值改为新日期，否则老访客可能看到旧版 JS/CSS）。
       ============================================================ -->
  <script src="js/tools/timestamp.js?v=20261030" defer></script>
  <script src="js/tools/json.js?v=20261030" defer></script>
  <script src="js/tools/md5-tool.js?v=20261030" defer></script>
  <script src="js/tools/base64.js?v=20261030" defer></script>
  <script src="js/tools/url.js?v=20261030" defer></script>
  <script src="js/region-data.js?v=20261030" defer></script>
  <script src="js/tools/idcard.js?v=20261030" defer></script>
  <script src="js/tools/worldclock.js?v=20261030" defer></script>
</body>
</html>
