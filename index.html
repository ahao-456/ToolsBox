<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolsBox</title>
  <meta name="description" content="ToolsBox：时间戳转换、MD5 计算等常用开发者小工具，可直接部署到 GitHub Pages。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Cg transform='translate(12 12) scale(1.65)' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/%3E%3C/g%3E%3C/svg%3E">
  <!-- iOS「添加到主屏幕」只认 apple-touch-icon（PNG，不能是 SVG/favicon data URI）；
       满方形不透明图，iOS 自动裁圆角。不加 ?v= 查询串（老 iOS 对带参路径有 bug） -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- 主题初始化：必须在样式表渲染前执行，避免闪烁 -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('toolbox-theme'); } catch (e) {}
      if (saved !== 'light' && saved !== 'dark') {
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261123i">
</head>
<body>
  <!-- 移动端顶栏（桌面端隐藏） -->
  <header class="topbar">
    <button class="topbar-btn" id="menu-toggle" type="button" aria-label="打开导航菜单">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="topbar-title" id="topbar-title">ToolsBox</span>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <a class="brand-home" href="#/">
          <span class="brand-logo" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </span>
          <span class="brand-name">ToolsBox</span>
        </a>
        <a class="brand-agent" href="javascript:(function()%7Bvar%20s=document.createElement(%27script%27);s.src=%60https://registry.npmmirror.com/page-agent/1.12.4/files/dist/iife/page-agent.demo.js?lang=zh-CN&amp;t=$%7BMath.random()%7D%60;s.setAttribute(%27crossorigin%27,%20true);s.type=%22text/javascript%22;s.onload=()=%3Econsole.log(%27PageAgent%20script%20loaded!%27);document.body.appendChild(s);%7D)();" draggable="true" title="点击启动 PageAgent，也可拖拽到书签栏" aria-label="启动 PageAgent">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/></svg>
          <span>Agent</span>
        </a>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" data-id="home" href="#/">
          <span class="nav-item-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </span>
          <span>首页</span>
        </a>
        <div class="nav-divider"></div>
        <!-- 工具分组由 app.js 根据 ToolBox.register(...) 的注册信息自动渲染 -->
        <div id="nav-groups"></div>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题"></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
      <div class="view" id="view"></div>
    </main>
  </div>

  <script src="js/app.js?v=20261122" defer></script>
  <script src="js/md5.js?v=20261115" defer></script>
  <!-- ============================================================
       ▼ 新增一个工具只需要 2 步：
         1. 在 js/tools/ 下新建 your-tool.js，调用 ToolBox.register({...})
            （模板见 js/tools/timestamp.js 的文件头注释）
         2. 在下面按现有顺序加一行：
              <script src="js/tools/your-tool.js?v=20261115" defer></script>
       侧边栏导航、首页卡片、hash 路由（#/your-tool）全部自动生成。

       注意：资源 URL 上的 ?v= 用于强制刷新浏览器缓存（静态站无构建工具，
       发布改动时需把 v 值改为新日期，否则老访客可能看到旧版 JS/CSS）。
       ============================================================ -->
  <script src="js/tools/timestamp.js?v=20261115" defer></script>
  <script src="js/tools/json.js?v=20261115" defer></script>
  <script src="js/tools/md5-tool.js?v=20261115" defer></script>
  <script src="js/tools/base64.js?v=20261115" defer></script>
  <script src="js/tools/url.js?v=20261115" defer></script>
  <script src="js/tools/unicode.js?v=20261115" defer></script>
  <script src="js/tools/deeplink.js?v=20261115" defer></script>
  <script src="js/tools/http-status.js?v=20261115" defer></script>
  <script src="js/tools/json-diff.js?v=20261115" defer></script>
  <script src="js/tools/sql.js?v=20261115" defer></script>
  <script src="js/tools/qrcode.js?v=20261115" defer></script>
  <script src="js/region-data.js?v=20261115" defer></script>
  <script src="js/tools/idcard.js?v=20261115" defer></script>
  <script src="js/tools/currency.js?v=20261115" defer></script>
  <script src="js/tools/cron.js?v=20261115" defer></script>
  <script src="js/tools/replace.js?v=20261115" defer></script>
  <script src="js/tools/worldclock.js?v=20261115" defer></script>
  <!-- ToolsBox-Agent：悬浮球 AI 控制台。需放在所有工具之后，确保注册表已就绪 -->
  <!-- 官方系统提示词必须逐字一致，请勿修改 js/page-agent-prompt.js -->
  <script src="js/page-agent-prompt.js?v=20261123" defer></script>
  <script src="js/page-agent.js?v=20261123k" defer></script>
</body>
</html>
